<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1290" width="1640" height="1290" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="ar-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1D4ED8"/>
    </marker>
    <marker id="ar-gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D6006E"/>
    </marker>
  </defs>

  <rect width="1640" height="1290" fill="#FFFFFF"/>

  <!-- ============ 제목 ============ -->
  <text x="40" y="52" font-size="38" font-weight="700" fill="#14181F">최종 아키텍처 — LightGBM 1 + mmBERT 4 게이트 앙상블</text>
  <text x="40" y="92" font-size="24" fill="#5A6472">모든 행에 모든 모델을 쓰지 않는다 — 두 모델이 갈리는 약 5%에만 추가 의견을 받는다</text>

  <!-- ============ 입력 ============ -->
  <rect x="520" y="132" width="600" height="78" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5"/>
  <text x="820" y="167" text-anchor="middle" font-size="28" font-weight="700" fill="#14181F">입력 — 에이전트 세션 스냅샷</text>
  <text x="820" y="196" text-anchor="middle" font-size="21" fill="#5A6472">current_prompt · history · session_meta</text>

  <!-- 입력 → 분배 -->
  <path d="M 820 210 L 820 250" stroke="#334155" stroke-width="2.5" fill="none"/>
  <path d="M 200 250 L 980 250" stroke="#334155" stroke-width="2.5" fill="none"/>
  <path d="M 200 250 L 200 286" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#ar-ink)"/>
  <path d="M 620 250 L 620 286" stroke="#1D4ED8" stroke-width="2.5" fill="none" marker-end="url(#ar-core)"/>
  <path d="M 980 250 L 980 286" stroke="#1D4ED8" stroke-width="2.5" fill="none" marker-end="url(#ar-core)"/>

  <!-- ============ 1층: 3개 모델 ============ -->
  <!-- LightGBM -->
  <rect x="60" y="290" width="280" height="124" rx="14" fill="#FFFFFF" stroke="#475569" stroke-width="3"/>
  <text x="200" y="332" text-anchor="middle" font-size="29" font-weight="700" fill="#14181F">LightGBM</text>
  <text x="200" y="362" text-anchor="middle" font-size="20" fill="#5A6472">스태킹 + 구조·ID 피처</text>
  <rect x="150" y="376" width="100" height="30" rx="15" fill="#475569"/>
  <text x="200" y="398" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">w 0.10</text>

  <!-- mmBERT s77 -->
  <rect x="470" y="290" width="300" height="124" rx="14" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/>
  <text x="620" y="332" text-anchor="middle" font-size="29" font-weight="700" fill="#14181F">mmBERT s77</text>
  <text x="620" y="362" text-anchor="middle" font-size="20" fill="#5A6472">v2 직렬화 · ID토큰</text>
  <rect x="570" y="376" width="100" height="30" rx="15" fill="#1D4ED8"/>
  <text x="620" y="398" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">w 0.45</text>

  <!-- mmBERT s7 -->
  <rect x="830" y="290" width="300" height="124" rx="14" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/>
  <text x="980" y="332" text-anchor="middle" font-size="29" font-weight="700" fill="#14181F">mmBERT s7</text>
  <text x="980" y="362" text-anchor="middle" font-size="20" fill="#5A6472">v3 직렬화 · ID+신호토큰</text>
  <rect x="930" y="376" width="100" height="30" rx="15" fill="#1D4ED8"/>
  <text x="980" y="398" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">w 0.25</text>

  <text x="1148" y="360" font-size="19" fill="#94A3B8">게이트 미작동 시</text>
  <text x="1148" y="384" font-size="19" fill="#94A3B8">w 0.45로 자동 복귀</text>

  <text x="800" y="452" text-anchor="middle" font-size="21" font-weight="700" fill="#1D4ED8">코어 2모델</text>

  <!-- 코어 2모델 → 게이트 -->
  <path d="M 620 414 L 620 464" stroke="#1D4ED8" stroke-width="2.5" fill="none"/>
  <path d="M 980 414 L 980 464" stroke="#1D4ED8" stroke-width="2.5" fill="none"/>
  <path d="M 620 464 L 980 464" stroke="#1D4ED8" stroke-width="2.5" fill="none"/>
  <path d="M 800 464 L 800 486" stroke="#1D4ED8" stroke-width="2.5" fill="none" marker-end="url(#ar-core)"/>

  <!-- ============ 게이트 판정 ============ -->
  <path d="M 800 490 L 1000 560 L 800 630 L 600 560 Z" fill="#FFF7FB" stroke="#D6006E" stroke-width="3"/>
  <text x="800" y="552" text-anchor="middle" font-size="25" font-weight="700" fill="#14181F">두 모델의</text>
  <text x="800" y="582" text-anchor="middle" font-size="25" font-weight="700" fill="#14181F">예측이 같은가?</text>

  <!-- YES 분기 -->
  <path d="M 600 560 L 380 560" stroke="#1D4ED8" stroke-width="2.5" fill="none"/>
  <path d="M 380 560 L 380 1010" stroke="#1D4ED8" stroke-width="2.5" fill="none" marker-end="url(#ar-core)"/>
  <text x="490" y="540" text-anchor="middle" font-size="23" font-weight="700" fill="#1D4ED8">일치 → 그대로</text>
  <text x="490" y="596" text-anchor="middle" font-size="23" font-weight="700" fill="#1D4ED8">약 95%</text>

  <!-- NO 분기 -->
  <path d="M 1000 560 L 1360 560" stroke="#D6006E" stroke-width="2.5" fill="none"/>
  <path d="M 1360 560 L 1360 664" stroke="#D6006E" stroke-width="2.5" fill="none" marker-end="url(#ar-gate)"/>
  <text x="1180" y="540" text-anchor="middle" font-size="23" font-weight="700" fill="#D6006E">이견 → 추가 판정</text>
  <text x="1180" y="596" text-anchor="middle" font-size="23" font-weight="700" fill="#D6006E">약 5%</text>

  <!-- ============ 콜아웃 ============ -->
  <rect x="450" y="700" width="620" height="180" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="760" y="744" text-anchor="middle" font-size="25" font-weight="700" fill="#14181F">불일치 자체를 난이도 신호로 쓴다</text>
  <text x="760" y="784" text-anchor="middle" font-size="21" fill="#5A6472">별도의 난이도 판별기 없이, 코어 2모델이 갈리는</text>
  <text x="760" y="814" text-anchor="middle" font-size="21" fill="#5A6472">지점이 곧 어려운 입력이다</text>
  <text x="760" y="854" text-anchor="middle" font-size="21" font-weight="700" fill="#1D4ED8">추가 모델은 5%에서만 동작 → 10분 예산 절약</text>

  <!-- ============ judge ============ -->
  <rect x="1170" y="668" width="380" height="116" rx="14" fill="#FFFFFF" stroke="#D6006E" stroke-width="3"/>
  <text x="1360" y="708" text-anchor="middle" font-size="29" font-weight="700" fill="#14181F">mmBERT s99 — judge</text>
  <text x="1360" y="738" text-anchor="middle" font-size="20" fill="#5A6472">v2 · 이견 행에만 투입</text>
  <rect x="1310" y="748" width="100" height="30" rx="15" fill="#D6006E"/>
  <text x="1360" y="770" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">w 0.20</text>

  <path d="M 1360 784 L 1360 824" stroke="#D6006E" stroke-width="2.5" fill="none" marker-end="url(#ar-gate)"/>

  <!-- ============ consensus ============ -->
  <rect x="1170" y="828" width="380" height="144" rx="14" fill="#FFFFFF" stroke="#D6006E" stroke-width="3"/>
  <text x="1360" y="868" text-anchor="middle" font-size="25" font-weight="700" fill="#14181F">mmBERT s123 — consensus</text>
  <text x="1360" y="898" text-anchor="middle" font-size="20" fill="#5A6472">judge와 답이 같고</text>
  <text x="1360" y="924" text-anchor="middle" font-size="20" fill="#5A6472">코어 한쪽도 지지할 때만</text>
  <rect x="1310" y="936" width="100" height="30" rx="15" fill="#D6006E"/>
  <text x="1360" y="958" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">w 0.15</text>

  <!-- 각 경로 → 결합 -->
  <path d="M 200 414 L 200 1010" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#ar-ink)"/>
  <path d="M 1360 972 L 1360 1010" stroke="#D6006E" stroke-width="2.5" fill="none" marker-end="url(#ar-gate)"/>

  <!-- ============ 결합 ============ -->
  <rect x="140" y="1014" width="1360" height="100" rx="14" fill="#14181F"/>
  <text x="820" y="1056" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">온도 보정 0.28  →  행별 가중 평균  →  argmax</text>
  <text x="820" y="1090" text-anchor="middle" font-size="21" fill="#B8C2CF">가용한 소스만으로 행마다 자동 재정규화 — 일부 모델이 실패해도 예측은 계속된다</text>

  <path d="M 820 1114 L 820 1152" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#ar-ink)"/>

  <!-- ============ 출력 ============ -->
  <rect x="580" y="1156" width="480" height="80" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5"/>
  <text x="820" y="1206" text-anchor="middle" font-size="30" font-weight="700" fill="#14181F">다음 행동 1개 · 14클래스</text>

  <!-- ============ 각주 ============ -->
  <text x="40" y="1272" font-size="20" fill="#5A6472">폴백 설계 — 모델 로드 실패 또는 10분 마감 시 남은 소스로 자동 재정규화, 미처리 행은 LightGBM 예측 유지 · 대회 전 기간 제출 실패 0회</text>

  <!-- ============ 해설용 번호 배지 (아키텍처_해설.md와 대응) ============ -->
  <g font-size="23" font-weight="700" text-anchor="middle" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">
    <circle cx="492"  cy="150"  r="20" fill="#334155" stroke="#FFFFFF" stroke-width="3"/>
    <text x="492"  y="158"  stroke="none">1</text>

    <circle cx="38"   cy="300"  r="20" fill="#475569" stroke="#FFFFFF" stroke-width="3"/>
    <text x="38"   y="308"  stroke="none">2</text>

    <circle cx="448"  cy="300"  r="20" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="3"/>
    <text x="448"  y="308"  stroke="none">3</text>

    <circle cx="808"  cy="300"  r="20" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="3"/>
    <text x="808"  y="308"  stroke="none">4</text>

    <circle cx="640"  cy="500"  r="20" fill="#D6006E" stroke="#FFFFFF" stroke-width="3"/>
    <text x="640"  y="508"  stroke="none">5</text>

    <circle cx="338"  cy="620"  r="20" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="3"/>
    <text x="338"  y="628"  stroke="none">6</text>

    <circle cx="1140" cy="680"  r="20" fill="#D6006E" stroke="#FFFFFF" stroke-width="3"/>
    <text x="1140" y="688"  stroke="none">7</text>

    <circle cx="1140" cy="840"  r="20" fill="#D6006E" stroke="#FFFFFF" stroke-width="3"/>
    <text x="1140" y="848"  stroke="none">8</text>

    <circle cx="112"  cy="1024" r="20" fill="#14181F" stroke="#FFFFFF" stroke-width="3"/>
    <text x="112"  y="1032" stroke="none">9</text>

    <circle cx="552"  cy="1172" r="20" fill="#334155" stroke="#FFFFFF" stroke-width="3"/>
    <text x="552"  y="1180" stroke="none">10</text>
  </g>
</svg>
